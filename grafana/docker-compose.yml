services:
  # 로그 저장소. 외부(Grafana Cloud 등) 의존 없이 완전히 로컬에서 자체 완결.
  # 공식 이미지에 내장된 기본 설정(local-config.yaml)을 그대로 쓴다 — 단일 바이너리 모드,
  # 파일시스템 저장, 인증 없음(로컬 전용이라 문제없음).
  loki:
    image: grafana/loki:3.3.2
    container_name: efk-pro-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-storage:/loki

  grafana:
    image: grafana/grafana:11.4.0
    container_name: efk-pro-grafana
    restart: unless-stopped
    depends_on:
      - loki
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - grafana-storage:/var/lib/grafana

volumes:
  grafana-storage:
  loki-storage:
